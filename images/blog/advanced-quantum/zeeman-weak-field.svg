<svg xmlns="http://www.w3.org/2000/svg" width="560" height="282" viewBox="0 0 560 282" role="img" aria-labelledby="title">
  <title id="title">弱场下按 j 和 m_j 展开的能级</title>
  <rect width="560" height="282" fill="#fff"/>
  <g fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 5">
    <path d="M130 130l64-48m-64 48 64 84"/>
    <path d="M288 82l77-52m-77 52 77-22m-77 22 77 52"/>
    <path d="M288 214l77-36m-77 36 77-18m-77 18 77 36"/>
  </g>
  <g fill="none" stroke="#243f5a" stroke-width="2.4" stroke-linecap="round">
    <path d="M40 130h90M194 82h94m-94 132h94"/>
    <path d="M365 30h58m-58 30h58m-58 74h58"/>
    <path d="M365 178h58m-58 18h58m-58 54h58"/>
  </g>
  <g fill="#182432" font-family="system-ui, sans-serif" font-size="16">
    <text x="85" y="116" text-anchor="middle">ℓ, s = ½</text>
    <text x="241" y="68" text-anchor="middle">j = ℓ + ½</text>
    <text x="241" y="200" text-anchor="middle">j = ℓ − ½</text>
    <text x="437" y="35">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = j</tspan></text>
    <text x="437" y="65">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = j − 1</tspan></text>
    <text x="394" y="106" text-anchor="middle">⋮</text>
    <text x="437" y="139">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = −j</tspan></text>
    <text x="437" y="183">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = j</tspan></text>
    <text x="437" y="201">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = j − 1</tspan></text>
    <text x="394" y="231" text-anchor="middle">⋮</text>
    <text x="437" y="255">m<tspan baseline-shift="sub" font-size="11">j</tspan><tspan> = −j</tspan></text>
  </g>
</svg>
